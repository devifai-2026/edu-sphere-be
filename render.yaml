services:
  - type: web
    name: edu-sphere-be
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      # Google Cloud — GCS video bucket + Vertex AI (service-account JSON is base64'd, never committed)
      - key: GCP_PROJECT_ID
        sync: false
      - key: GCP_LOCATION
        sync: false
      - key: GCS_BUCKET
        sync: false
      - key: GCP_SA_JSON_BASE64
        sync: false
